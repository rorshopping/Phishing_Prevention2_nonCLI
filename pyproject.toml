[project]
name = "phishguard"
version = "0.1.0"
description = "AI-first phishing simulation platform for SMEs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "openai>=1.12.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "jinja2>=3.1.3",
    "twilio>=8.10.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
phishguard = "src.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]
test = ["phishguard[dev]"]

[tool.setuptools.packages.find]
where = ["src"]
